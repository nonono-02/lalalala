<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A letter for you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Lora:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="letter-wrap">
  <article class="letter" id="letter"><h1>A letter for you 💗 </h1></article>
</main>
<div class="actions"><a class="btn alt" href="index.html">Back to photos</a></div>
<script src="data.js"></script>
<script>
const sheet = document.getElementById("letter");
LETTER.forEach((t, i) => {
  const p = document.createElement("p");
  if (i === LETTER.length - 1) p.className = "letter-signoff";
  p.textContent = t;
  sheet.appendChild(p);
});
</script>
</body>
</html>
