<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Monthsary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Lora:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=4">
<style>
/* book pages and arrows live here so they work even if style.css is an older copy */
.letter .pages{display:block}
.letter .page{display:none;visibility:visible;opacity:1;transform:none}
.letter .page.on{display:block;animation:turn .3s ease}
.letter .page.before.on{animation-name:turnback}
.letter .page p{margin:0;color:#2b2a33}
.letter .page p + p{margin-top:1.4em}
.letter .page p.sign{color:#8b5a3c}
@keyframes turn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes turnback{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.letter .nav{display:flex;align-items:center;justify-content:space-between;margin-top:28px;
  padding-top:18px;border-top:2px dotted #c79a74}
.letter .count{font-size:1.05rem;color:#8b5a3c;font-weight:600}
.letter .arrow{width:48px;height:48px;border-radius:50%;border:0;background:#8b5a3c;cursor:pointer;padding:0;
  display:grid;place-items:center;box-shadow:0 4px 0 #5f3a24;transition:transform .15s,box-shadow .15s,opacity .15s}
.letter .arrow:hover:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #5f3a24}
.letter .arrow:disabled{opacity:.3;cursor:default}
.letter .arrow:focus-visible{outline:3px solid #3b78d1;outline-offset:3px}
@media (prefers-reduced-motion:reduce){.letter .page.on{animation:none}}
</style>
</head>
<body>
<header class="hero">
  <div class="num" id="num">1</div>
  <h1 id="title">Month together</h1>
  <p><svg class="heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.3 3 5 6.4 5c2 0 3.7 1.1 5.6 3.2C13.9 6.1 15.6 5 17.6 5 21 5 23.1 8.3 21.6 11.8 19.5 16.4 12 21 12 21z"/></svg> <span id="names"></span> <svg class="heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.3 3 5 6.4 5c2 0 3.7 1.1 5.6 3.2C13.9 6.1 15.6 5 17.6 5 21 5 23.1 8.3 21.6 11.8 19.5 16.4 12 21 12 21z"/></svg></p>
</header>
<main class="layout">
  <aside class="side" id="left"></aside>
  <article class="letter" id="letter">
    <h2>A letter for you</h2>
    <div class="pages" id="pages"></div>
    <nav class="nav" aria-label="Letter pages">
      <button class="arrow" id="prev" aria-label="Previous page"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span class="count" id="count" aria-live="polite"></span>
      <button class="arrow" id="next" aria-label="Next page"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    </nav>
  </article>
  <aside class="side" id="right"></aside>
</main>
<script src="data.js?v=4"></script>
<script>
document.getElementById("num").textContent = SITE.months;
document.getElementById("title").textContent = SITE.months === 1 ? "Month together" : "Months together";
document.getElementById("names").textContent = SITE.from + " and " + SITE.to;

const letter = document.getElementById("letter");
const TEXT = typeof MESSAGES !== "undefined" ? MESSAGES : LETTER;
const pagesBox = document.getElementById("pages");
const prev = document.getElementById("prev");
const next = document.getElementById("next");
const count = document.getElementById("count");
// a line that starts with a dash is a sign-off, so it joins the paragraph before it
const groups = [];
TEXT.forEach(t => {
  if (/^\s*[-\u2013\u2014]/.test(t) && groups.length) groups[groups.length - 1].push(t);
  else groups.push([t]);
});
const pages = groups.map(g => {
  const d = document.createElement("div");
  d.className = "page";
  g.forEach((t, i) => {
    const p = document.createElement("p");
    p.textContent = t;
    if (i > 0) p.className = "sign";
    d.appendChild(p);
  });
  pagesBox.appendChild(d);
  return d;
});
let now = 0;
function show(i) {
  now = Math.max(0, Math.min(pages.length - 1, i));
  pages.forEach((d, n) => {
    d.classList.toggle("on", n === now);
    d.classList.toggle("before", n < now);
    d.style.display = n === now ? "block" : "none";
    d.setAttribute("aria-hidden", n === now ? "false" : "true");
  });
  count.textContent = (now + 1) + " / " + pages.length;
  prev.disabled = now === 0;
  next.disabled = now === pages.length - 1;
}
prev.onclick = () => show(now - 1);
next.onclick = () => show(now + 1);
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") show(now - 1);
  if (e.key === "ArrowRight") show(now + 1);
});
let x0 = null;
letter.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, {passive:true});
letter.addEventListener("touchend", e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0;
  if (Math.abs(dx) > 50) show(now + (dx < 0 ? 1 : -1));
  x0 = null;
});
show(0);

// keep the card as tall as the longest page, so the layout never jumps
function fitBook() {
  pagesBox.style.minHeight = "";
  let tallest = 0;
  pages.forEach(d => { d.style.display = "block"; tallest = Math.max(tallest, d.offsetHeight); });
  pagesBox.style.minHeight = tallest + "px";
  pages.forEach((d, n) => { d.style.display = n === now ? "block" : "none"; });
}

const left = document.getElementById("left");
const right = document.getElementById("right");
const wide = window.matchMedia("(min-width: 1001px)");
let loaded = [];

// on desktop, the photo columns stop where the letter stops
function fit() {
  const h = wide.matches ? letter.offsetHeight + "px" : "";
  left.style.maxHeight = h; right.style.maxHeight = h;
}
new ResizeObserver(fit).observe(letter);

function layout() {
  left.textContent = ""; right.textContent = "";
  let hl = 0, hr = 0;
  loaded.forEach(img => {
    const fig = document.createElement("figure");
    fig.className = "shot";
    fig.appendChild(img.cloneNode());
    const h = img.naturalHeight / img.naturalWidth;
    if (!wide.matches || hl <= hr) { left.appendChild(fig); hl += h; }
    else { right.appendChild(fig); hr += h; }
  });
  fit();
}

Promise.all(PHOTOS.map((src, i) => new Promise(done => {
  const img = new Image();
  img.alt = "Our photo " + (i + 1);
  img.onload = () => done(img);
  img.onerror = () => done(null);
  img.src = src;
}))).then(list => { loaded = list.filter(Boolean); layout(); });

wide.addEventListener("change", layout);
fitBook();
window.addEventListener("resize", () => { fitBook(); fit(); });
if (document.fonts) document.fonts.ready.then(() => { fitBook(); fit(); });
</script>
</body>
</html>
